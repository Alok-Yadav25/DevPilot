# Render Free web service. PostgreSQL is provisioned separately on Neon.
# Live-runner template; the hosted service currently uses replay mode.
# Free services have no pre-deploy hook; app.serve migrates before Uvicorn starts.
services:
  - type: web
    name: devpilot-api-alok-yadav25
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health?lightweight=true
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: production
      - key: RUNNER_MODE
        value: github_actions
      - key: DATABASE_AUTO_CREATE
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: API_ACCESS_TOKEN
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: SANDBOX_REPO
        value: Alok-Yadav25/devpilot-sandbox
      - key: SANDBOX_GITHUB_TOKEN
        sync: false
      - key: TARGET_GITHUB_TOKEN
        sync: false
      - key: ALLOWED_TARGET_OWNER
        value: Alok-Yadav25
      - key: ALLOWED_TARGET_REPOS
        value: Alok-Yadav25/devpilot-example-slugify,Alok-Yadav25/devpilot-example-clamp,Alok-Yadav25/devpilot-example-backoff
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: MAX_CONCURRENT_RUNS
        value: "1"
      - key: MAX_QUEUED_RUNS
        value: "10"
      - key: REQUESTS_PER_MINUTE
        value: "30"
